; ROBOT VOICE — PlatformIO build config
;
; Board: Teensy 4.1 (change to board = teensy40 and set ENABLE_USB_HOST 0
;        in src/config.h if you drop down to a 4.0 — the 4.0 has no USB
;        host header).
;
; USB_MIDI_SERIAL is the PlatformIO equivalent of the Arduino IDE's
; Tools > USB Type > "Serial + MIDI". Without it there is no usbMIDI object
; and MIDI input 1 (computer/DAW) will not compile.
;
; Build:  pio run
; Flash:  pio run -t upload     (press the Teensy button if it does not
;                                reboot on its own)

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

build_flags =
    -D USB_MIDI_SERIAL
    -I src          ; so modules can #include "voice/voice.h" from anywhere

; The Audio, PWMServo, MIDI and USBHost_t36 libraries all ship with the
; Teensy core that PlatformIO installs — no lib_deps needed.
